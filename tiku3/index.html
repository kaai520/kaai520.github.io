<script>
    const allQuestions = [{"type":"单选题","category":"安全科学基础理论","stem":"（）要素是人、机、环境、管理。","options":["A. 事故系统","B. 机械系统","C. 安全系统","D. 人机系统"],"answer":"A","src_no":1,"id":1,"fulltitle":"1. 【单选题】（）要素是人、机、环境、管理。"},{"type":"单选题","category":"安全科学基础理论","stem":"安全史学总结出的最基本的安全生产策略和方法是（）。","options":["A. 安全第一","B. 风险管理","C. 综合治理","D. 预防为主"],"answer":"D","src_no":2,"id":2,"fulltitle":"2. 【单选题】安全史学总结出的最基本的安全生产策略和方法是（）。"},{"type":"单选题","category":"安全科学基础理论","stem":"安全经济学的目的是实现（）三者的最佳安全效益。","options":["A. 人、资金、设备","B. 人、技术、环境","C. 人、设备、环境","D. 投入、工艺、技术"],"answer":"B","src_no":3,"id":3,"fulltitle":"3. 【单选题】安全经济学的目的是实现（）三者的最佳安全效益。"},{"type":"单选题","category":"安全科学基础理论","stem":"（）的要素是人、物、能量、信息。","options":["A. 事故系统","B. 机械系统","C. 安全系统","D. 人机系统"],"answer":"C","src_no":4,"id":4,"fulltitle":"4. 【单选题】（）的要素是人、物、能量、信息。"},{"type":"单选题","category":"安全科学基础理论","stem":"安全投资可以使事故降低其（）。","options":["A. 发生率和伤亡率","B. 下降率和死亡率","C. 严重度和下降率","D. 发生率和严重度"],"answer":"D","src_no":5,"id":5,"fulltitle":"5. 【单选题】安全投资可以使事故降低其（）。"},{"type":"单选题","category":"安全科学基础理论","stem":"“三同时”是指在工程建设项目中要遵循安全措施与技术设施（）的原则。","options":["A. 同时设计、同时验收、同时投产","B. 同时规划、同时设计、同时施工","C. 同时设计、同时施工、同时验收","D. 同时设计、同时施工、同时投产"],"answer":"D","src_no":6,"id":6,"fulltitle":"6. 【单选题】“三同时”是指在工程建设项目中要遵循安全措施与技术设施（）的原则。"},{"type":"单选题","category":"安全科学基础理论","stem":"安全系统的基本功能和任务是满足人类安全的（）。","options":["A. 工作和经营","B. 生产与生存","C. 预防为主","D. 责任落实"],"answer":"B","src_no":7,"id":7,"fulltitle":"7. 【单选题】安全系统的基本功能和任务是满足人类安全的（）。"},{"type":"单选题","category":"安全科学基础理论","stem":"安全工作的重点应该放在人的身上，提高人的综合素质，提高人的安全意识，提高生产者遵守安全规章制度的自觉性，提高他们的工作技能及安全防护技能，尊重他们的意愿和要求，这就是“（）”。","options":["A. 安全管理","B. 以人为本","C. 预防为主","D. 责任落实"],"answer":"B","src_no":8,"id":8,"fulltitle":"8. 【单选题】安全工作的重点应该放在人的身上，提高人的综合素质，提高人的安全意识，提高生产者遵守安全规章制度的自觉性，提高他们的工作技能及安全防护技能，尊重他们的意愿和要求，这就是“（）”。"},{"type":"单选题","category":"安全科学基础理论","stem":"人在心理活动失常时会导致生产工作的不稳定性。而良好的安全心理活动可以发挥人的（）,为提高安全效果提供稳定可靠的保障。","options":["A. 积极性、主观能动性","B. 积极性、创造性","C. 创造性、主动性","D. 主观能动性、可靠性"],"answer":"A","src_no":9,"id":9,"ful 作业安全","stem":"有限空间施工、检修、清理等作业结束后，应实施工作终结制度。如作业结束，应复核清点出入有限空间的人数，确认工器具、材料等已清理完毕。（）","options":["A. 正确","B. 错误"],"answer":"A","src_no":24,"id":264,"fulltitle":"264. 【判断题】有限空间施工、检修、清理等作业结束后，应实施工作终结制度。如作业结束，应复核清点出入有限空间的人数，确认工器具、材料等已清理完毕。（）"},{"type":"判断题","category":"现场作业安全","stem":"起重机械操作的相关人员必须要有相关部门颁发的资质证书。（）","options":["A. 正确","B. 错误"],"answer":"A","src_no":25,"id":265,"fulltitle":"265. 【判断题】起重机械操作的相关人员必须要有相关部门颁发的资质证书。（）"},{"type":"判断题","category":"电力系统安全稳定与调度控制","stem":"单一变电站供电，是指由与省级主电网连接的一个变电站且一台变压器供电的供电方式。有一回路或者多回路输电线路串联供电的多个变电站的供电方式，视同于单一变电站供电。（）","options":["A. 正确","B. 错误"],"answer":"A","src_no":26,"id":266,"fulltitle":"266. 【判断题】单一变电站供电，是指由与省级主电网连接的一个变电站且一台变压器供电的供电方式。有一回路或者多回路输电线路串联供电的多个变电站的供电方式，视同于单一变电站供电。（）"},{"type":"判断题","category":"事故管理与应急管理","stem":"直接经济损失包括更换的备品配件、材料、人工和运输费用。如设备损坏不能再修复，则按同类型设备重置金额计算损失费用。保险公司赔偿费可减部分直接经济损失。（）","options":["A. 正确","B. 错误"],"answer":"B","src_no":27,"id":267,"fulltitle":"267. 【判断题】直接经济损失包括更换的备品配件、材料、人工和运输费用。如设备损坏不能再修复，则按同类型设备重置金额计算损失费用。保险公司赔偿费可减部分直接经济损失。（）"},{"type":"判断题","category":"事故管理与应急管理","stem":"专家评审应急预案时，应坚持服从上级、独立客观、公平公正、诚实守信原则，对评审意见负责并承担责任。（）","options":["A. 正确","B. 错误"],"answer":"B","src_no":28,"id":268,"fulltitle":"268. 【判断题】专家评审应急预案时，应坚持服从上级、独立客观、公平公正、诚实守信原则，对评审意见负责并承担责任。（）"},{"type":"判断题","category":"事故管理与应急管理","stem":"应急预案评审通过后，由生产经营单位分管领导签署公布(印发)。（）","options":["A. 正确","B. 错误"],"answer":"B","src_no":29,"id":269,"fulltitle":"269. 【判断题】应急预案评审通过后，由生产经营单位分管领导签署公布(印发)。（）"},{"type":"判断题","category":"事故管理与应急管理","stem":"应急资源发生变化时，应及时修订应急预案。（）","options":["A. 正确","B. 错误"],"answer":"B","src_no":30,"id":270,"fulltitle":"270. 【判断题】应急资源发生变化时，应及时修订应急预案。（）"}];
    const categories = ["安全科学基础理论","安全生产法规与体系","安全生产目标与责任制","安全生产费用与安全文化","安全检查与隐患排查","安全工器具与特种作业","承发包工程安全管理","消防安全管理","职业健康与职业病防治","电力可靠性管理","电力系统安全稳定与调度控制","电力监控系统安全防护","现场作业安全","事故管理与应急管理"];
    let currentList = [...allQuestions], currentIndex = 0, currentMode = 'all', selectedLetters = new Set(), isAnswered = false;
    let sessionAnswered = 0, sessionRight = 0;
    const LS_KEY = 'gd_safety_tiku_wrong_ids_v1';
    let wrongSet = new Set(JSON.parse(localStorage.getItem(LS_KEY) || '[]'));

    function saveWrongSet() { localStorage.setItem(LS_KEY, JSON.stringify(Array.from(wrongSet))); updateWrongBadge(); }
    function updateWrongBadge() { document.getElementById('wrong-count-badge').innerText = `错题本: ${wrongSet.size}`; document.getElementById('btn-mode-wrong').innerText = `🔴 错题专练 (${wrongSet.size})`; }
    function updateStats() {
        document.getElementById('stat-answered').innerText = sessionAnswered;
        document.getElementById('stat-right').innerText = sessionRight;
        document.getElementById('stat-rate').innerText = sessionAnswered ? Math.round(sessionRight / sessionAnswered * 100) + '%' : '--';
    }

    // build filters
    (function initFilters(){
        const tf = document.getElementById('type-filter');
        const types = ['单选题','多选题','判断题'];
        tf.innerHTML = `<option value="all">🔍 筛选所有题型 (${allQuestions.length})</option>` +
            types.map(t=>`<option value="${t}">${t} (${allQuestions.filter(q=>q.type===t).length})</option>`).join('');
        const cf = document.getElementById('cat-filter');
        cf.innerHTML = `<option value="all">📂 筛选所有章节 (${categories.length})</option>` +
            categories.map(c=>{
                const n = allQuestions.filter(q=>q.category===c).length;
                return `<option value="${c}">${c} (${n})</option>`;
            }).join('');
        document.getElementById('total-count').innerText = allQuestions.length;
    })();

    function switchMode(mode) {
        currentMode = mode;
        document.getElementById('btn-mode-all').classList.toggle('active', mode === 'all');
        document.getElementById('btn-mode-wrong').classList.toggle('active', mode === 'wrong');
        document.getElementById('header-mode-text').innerText = mode === 'all' ? "📚 全部题目练习" : "🔴 错题集专属强化";
        applyFilter();
    }
    function applyFilter() {
        const typeVal = document.getElementById('type-filter').value;
        const catVal = document.getElementById('cat-filter').value;
        let pool = currentMode === 'all' ? allQuestions : allQuestions.filter(q => wrongSet.has(q.id));
        if (typeVal !== 'all') pool = pool.filter(q => q.type === typeVal);
        if (catVal !== 'all') pool = pool.filter(q => q.category === catVal);
        currentList = pool; currentIndex = 0; renderQuestion();
    }
    function renderQuestion() {
        selectedLetters.clear(); isAnswered = false;
        const resBox = document.getElementById('result-box'); resBox.style.display = 'none'; resBox.className = 'result-box';
        if (currentList.length === 0) {
            document.getElementById('q-title-text').innerText = currentMode === 'wrong' ? "🎉 太棒了！当前没有任何错题记录～" : "没找到符合要求的试题";
            document.getElementById('options-box').innerHTML = ""; document.getElementById('page-indicator').innerText = "0 / 0";
            document.getElementById('submit-btn').style.display = "none";
            document.getElementById('q-category').innerText = ""; document.getElementById('q-type-badge').innerText = "";
            return;
        }
        const q = currentList[currentIndex];
        document.getElementById('q-category').innerText = q.category; document.getElementById('q-type-badge').innerText = q.type;
        document.getElementById('q-title-text').innerText = q.fulltitle; document.getElementById('page-indicator').innerText = `${currentIndex + 1} / ${currentList.length}`;
        const isMulti = q.type === '多选题' || q.type === '不定项选择题';
        document.getElementById('submit-btn').style.display = isMulti ? 'inline-block' : 'none';
        const optBox = document.getElementById('options-box'); optBox.innerHTML = '';
        q.options.forEach(optStr => {
            const letter = optStr.charAt(0);
            const div = document.createElement('div'); div.className = 'option-item'; div.innerText = optStr;
            div.onclick = () => onSelectOption(letter, isMulti, div, q); optBox.appendChild(div);
        });
    }
    function onSelectOption(letter, isMulti, el, qData) {
        if (isAnswered) return;
        if (!isMulti) { selectedLetters.clear(); selectedLetters.add(letter); evaluateAnswer(qData); }
        else {
            if (selectedLetters.has(letter)) { selectedLetters.delete(letter); el.classList.remove('selected'); }
            else { selectedLetters.add(letter); el.classList.add('selected'); }
        }
    }
    function submitAnswer() {
        if (isAnswered) return;
        if (selectedLetters.size === 0) { alert("请至少选择一个选项后再提交！"); return; }
        evaluateAnswer(currentList[currentIndex]);
    }
    function ansLabel(q, letters) {
        if (q.type === '判断题') {
            return letters.split('').map(l => l === 'A' ? 'A（正确）' : 'B（错误）').join('');
        }
        return letters;
    }
    function evaluateAnswer(q) {
        isAnswered = true; document.getElementById('submit-btn').style.display = 'none';
        const userAns = Array.from(selectedLetters).sort().join('');
        const correctAns = q.answer.split('').sort().join('');
        const isCorrect = (userAns === correctAns);
        const optionDivs = document.getElementById('options-box').children;
        for (let div of optionDivs) {
            const l = div.innerText.charAt(0); div.classList.remove('selected');
            if (correctAns.includes(l)) div.classList.add('correct');
            else if (userAns.includes(l) && !correctAns.includes(l)) div.classList.add('wrong');
        }
        const resBox = document.getElementById('result-box'); resBox.style.display = 'block';
        sessionAnswered++;
        if (isCorrect) {
            sessionRight++;
            resBox.className = 'result-box success';
            resBox.innerHTML = `✅ <strong>回答正确！</strong> 正确答案是：<span style="font-size:17px; text-decoration: underline;">${ansLabel(q, q.answer)}</span>`;
            if (wrongSet.has(q.id)) { wrongSet.delete(q.id); saveWrongSet(); }
        } else {
            resBox.className = 'result-box error';
            resBox.innerHTML = `❌ <strong>回答错误！</strong><br>你的答案：<b>${ansLabel(q, userAns) || '未选择'}</b> &nbsp;|&nbsp; 正确答案是：<span style="font-size:17px; color:#276749; background:#f0fff4; padding:2px 6px; border-radius:4px;">${ansLabel(q, q.answer)}</span>`;
            wrongSet.add(q.id); saveWrongSet();
        }
        updateStats();
    }
    function prevQ() { if (currentIndex > 0) { currentIndex--; renderQuestion(); } }
    function nextQ() { if (currentIndex < currentList.length - 1) { currentIndex++; renderQuestion(); } }
    function jumpToRandom() { if (currentList.length === 0) return; currentIndex = Math.floor(Math.random() * currentList.length); renderQuestion(); }
    function clearWrongHistory() {
        if (confirm("确定要清空错题本的全部练习记忆吗？")) {
            wrongSet.clear(); saveWrongSet();
            if (currentMode === 'wrong') applyFilter();
        }
    }
    document.addEventListener('keydown', function(e){
        if (e.key === 'ArrowLeft') prevQ();
        if (e.key === 'ArrowRight') nextQ();
    });
    updateWrongBadge(); updateStats(); applyFilter();
</script>
</body>
</html>
