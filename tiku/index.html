        const correctAns = q.answer.split('').sort().join('');
        const isCorrect = (userAns === correctAns);
        const optionDivs = document.getElementById('options-box').children;
        for (let div of optionDivs) {
            const l = div.innerText.charAt(0); div.classList.remove('selected');
            if (correctAns.includes(l)) div.classList.add('correct');
            else if (userAns.includes(l) && !correctAns.includes(l)) div.classList.add('wrong');
        }
        const resBox = document.getElementById('result-box'); resBox.style.display = 'block';
        if (isCorrect) {
            resBox.className = 'result-box success';
            resBox.innerHTML = `✅ <strong>回答正确！</strong> 正确答案是：<span style="font-size:17px; text-decoration: underline;">${ansLabel(q, q.answer)}</span>`;
            if (wrongSet.has(q.id)) { wrongSet.delete(q.id); saveWrongSet(); }
        } else {
            resBox.className = 'result-box error';
            resBox.innerHTML = `❌ <strong>回答错误！</strong><br>你的答案：<b>${ansLabel(q, userAns) || '未选择'}</b> &nbsp;|&nbsp; 正确答案是：<span style="font-size:17px; color:#276749; background:#f0fff4; padding:2px 6px; border-radius:4px;">${ansLabel(q, q.answer)}</span>`;
            wrongSet.add(q.id); saveWrongSet();
        }
    }
    function prevQ() { if (currentIndex > 0) { currentIndex--; renderQuestion(); } }
    function nextQ() { if (currentIndex < currentList.length - 1) { currentIndex++; renderQuestion(); } }
    function jumpToRandom() { if (currentList.length === 0) return; currentIndex = Math.floor(Math.random() * currentList.length); renderQuestion(); }
    function clearWrongHistory() {
        if (confirm("确定要清空错题本的全部练习记忆吗？")) {
            wrongSet.clear(); saveWrongSet();
            if (currentMode === 'wrong') applyFilter();
        }
    }
    updateWrongBadge(); applyFilter();
</script>
</body>
</html>
